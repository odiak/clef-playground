<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #f38020;
        --yellow: #faae40;
        --cream: #fff6ec;
        --peach: #ffe3c8;
        --ink: #2b2b33;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "M PLUS Rounded 1c", sans-serif;
        color: var(--ink);
        background-color: var(--cream);
        background-image: radial-gradient(color-mix(in srgb, var(--orange) 22%, transparent) 3px, transparent 3px);
        background-size: 36px 36px;
        padding: 48px 64px 64px 48px;
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 40px;
        height: 100%;
        padding: 0 48px;
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: 56px;
        background: #fff;
        box-shadow: 16px 16px 0 0 var(--orange);
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
      }
      .text {
        position: relative;
        flex: 1;
      }
      .tag {
        display: inline-block;
        padding: 6px 20px;
        border-radius: 9999px;
        background: var(--peach);
        color: #c95f0a;
        font-size: 24px;
        font-weight: 800;
      }
      h1 {
        margin-top: 18px;
        font-size: 86px;
        font-weight: 900;
        line-height: 1.1;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: var(--orange);
      }
      .lead {
        margin-top: 14px;
        font-size: 30px;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 80%, transparent);
      }
      .chips {
        display: flex;
        gap: 14px;
        margin-top: 28px;
      }
      .chip {
        padding: 8px 20px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        font-size: 30px;
        font-weight: 900;
        line-height: 1.2;
        white-space: nowrap;
      }
      .bingo {
        position: relative;
        flex: none;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        width: 320px;
        padding: 14px;
        border: 6px solid var(--ink);
        border-radius: 40px;
        background: var(--orange);
        box-shadow: 10px 10px 0 0 var(--ink);
        transform: rotate(3deg);
      }
      .cell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        border: 4px solid var(--ink);
        border-radius: 20px;
        background: #fff;
        font-size: 56px;
        line-height: 1;
      }
      .cell small {
        position: relative;
        z-index: 1;
        margin-top: 4px;
        padding: 0 6px;
        border-radius: 8px;
        background: rgb(255 255 255 / 0.9);
        font-size: 15px;
        font-weight: 900;
      }
      .cell.punched {
        background: var(--peach);
        outline: 5px solid var(--yellow);
        outline-offset: 2px;
      }
      /* 揃ったライン以外の穴 */
      .cell.punched.plain {
        outline: none;
      }
      .cell.punched::after {
        content: "";
        position: absolute;
        inset: 6px;
        border: 6px solid var(--orange);
        border-radius: 9999px;
      }
      .sticker {
        position: absolute;
        top: -70px;
        left: 50%;
        padding: 6px 22px;
        border: 5px solid var(--ink);
        border-radius: 24px;
        background: var(--yellow);
        box-shadow: 0 6px 0 0 var(--ink);
        font-size: 36px;
        font-weight: 900;
        letter-spacing: 0.04em;
        white-space: nowrap;
        transform: translateX(-50%) rotate(-6deg);
      }
      .footer {
        margin-top: 28px;
        font-size: 20px;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 55%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="blob" style="top: -90px; right: -90px; width: 300px; height: 300px; background: color-mix(in srgb, var(--yellow) 40%, transparent)"></div>
      <div class="blob" style="bottom: -120px; right: 300px; width: 220px; height: 220px; background: color-mix(in srgb, var(--orange) 15%, transparent)"></div>

      <div class="text">
        <p class="tag">Clef Playground</p>
        <h1>写真<span>ビンゴ</span></h1>
        <p class="lead">お題を探して撮影！AI が認めたら穴が空く</p>
        <div class="chips">
          <span class="chip">🍎 りんご</span>
          <span class="chip">🔑 鍵</span>
          <span class="chip">✏️ 鉛筆</span>
        </div>
        <p class="footer">Powered by Clef on Cloudflare Workers AI</p>
      </div>

      <div class="bingo">
        <div class="cell punched plain">🍎<small>りんご</small></div>
        <div class="cell">☕<small>コップ</small></div>
        <div class="cell">🧦<small>靴下</small></div>
        <div class="cell punched">🔑<small>鍵</small></div>
        <div class="cell punched">✏️<small>鉛筆</small></div>
        <div class="cell punched">🪴<small>植物</small></div>
        <div class="cell">📕<small>本</small></div>
        <div class="cell punched plain">✂️<small>はさみ</small></div>
        <div class="cell">🧢<small>帽子</small></div>
        <span class="sticker">BINGO! 🎉</span>
      </div>
    </div>
  </body>
</html>
