<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #f38020;
        --yellow: #faae40;
        --cream: #fff6ec;
        --peach: #ffe3c8;
        --ink: #2b2b33;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "M PLUS Rounded 1c", sans-serif;
        color: var(--ink);
        background-color: var(--cream);
        background-image: radial-gradient(color-mix(in srgb, var(--orange) 22%, transparent) 3px, transparent 3px);
        background-size: 36px 36px;
        padding: 48px 64px 64px 48px;
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 40px;
        height: 100%;
        padding: 0 48px;
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: 56px;
        background: #fff;
        box-shadow: 16px 16px 0 0 var(--orange);
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
      }
      .text {
        position: relative;
        flex: 1;
      }
      .tag {
        display: inline-block;
        padding: 6px 20px;
        border-radius: 9999px;
        background: var(--peach);
        color: #c95f0a;
        font-size: 24px;
        font-weight: 800;
      }
      h1 {
        margin-top: 18px;
        font-size: 86px;
        font-weight: 900;
        line-height: 1.1;
        white-space: nowrap;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: var(--orange);
      }
      .lead {
        margin-top: 14px;
        font-size: 30px;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 80%, transparent);
      }
      .chips {
        display: flex;
        gap: 14px;
        margin-top: 28px;
      }
      .chip {
        padding: 8px 20px;
        border: 4px solid var(--ink);
        border-radius: 24px;
        font-size: 38px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .stage {
        position: relative;
        flex: none;
        width: 320px;
        height: 320px;
        border: 6px solid var(--ink);
        border-radius: 40px;
        background: var(--peach);
        box-shadow: 10px 10px 0 0 var(--orange);
        transform: rotate(3deg);
      }
      .face {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        padding-top: 22px;
        font-size: 160px;
        line-height: 1;
      }
      .bubbles {
        position: absolute;
        right: 14px;
        bottom: 14px;
        left: 14px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .bubble {
        width: 104px;
        padding: 6px 0 8px;
        border: 5px solid var(--ink);
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 6px 0 0 var(--ink);
        text-align: center;
      }
      .bubble.win {
        background: var(--yellow);
      }
      .bubble small {
        display: block;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .bubble div {
        font-size: 48px;
        line-height: 1.1;
      }
      .vs {
        margin-bottom: 22px;
        padding: 2px 14px;
        border: 5px solid var(--ink);
        border-radius: 9999px;
        background: var(--orange);
        color: #fff;
        font-size: 28px;
        font-style: italic;
        font-weight: 900;
      }
      .sticker {
        position: absolute;
        top: -34px;
        left: -40px;
        padding: 6px 22px;
        border: 5px solid var(--ink);
        border-radius: 24px;
        background: var(--orange);
        box-shadow: 0 6px 0 0 var(--ink);
        color: #fff;
        font-size: 40px;
        font-weight: 900;
        transform: rotate(-10deg);
      }
      .footer {
        margin-top: 28px;
        font-size: 20px;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 55%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="blob" style="top: -90px; right: -90px; width: 300px; height: 300px; background: color-mix(in srgb, var(--yellow) 40%, transparent)"></div>
      <div class="blob" style="bottom: -120px; right: 300px; width: 220px; height: 220px; background: color-mix(in srgb, var(--orange) 15%, transparent)"></div>

      <div class="text">
        <p class="tag">Clef Playground</p>
        <h1>表情<span>じゃんけん</span></h1>
        <p class="lead">顔の表情で、AI とじゃんけん勝負！</p>
        <div class="chips">
          <span class="chip">😄→🖐️</span>
          <span class="chip">😢→✌️</span>
          <span class="chip">😠→✊</span>
        </div>
        <p class="footer">Powered by Clef on Cloudflare Workers AI</p>
      </div>

      <div class="stage">
        <div class="face">😄</div>
        <div class="bubbles">
          <div class="bubble win"><small>あなた</small><div>🖐️</div></div>
          <span class="vs">VS</span>
          <div class="bubble"><small>コンピューター</small><div>✊</div></div>
        </div>
        <span class="sticker">かち！🎉</span>
      </div>
    </div>
  </body>
</html>
