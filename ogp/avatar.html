<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --orange: #f38020;
        --yellow: #faae40;
        --cream: #fff6ec;
        --peach: #ffe3c8;
        --ink: #2b2b33;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "M PLUS Rounded 1c", sans-serif;
        color: var(--ink);
        background-color: var(--cream);
        background-image: radial-gradient(color-mix(in srgb, var(--orange) 22%, transparent) 3px, transparent 3px);
        background-size: 36px 36px;
        padding: 48px 64px 64px 48px;
      }
      .card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 24px;
        height: 100%;
        padding: 0 48px;
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: 56px;
        background: #fff;
        box-shadow: 16px 16px 0 0 var(--orange);
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
      }
      .text {
        position: relative;
        flex: 1;
      }
      .tag {
        display: inline-block;
        padding: 6px 20px;
        border-radius: 9999px;
        background: var(--peach);
        color: #c95f0a;
        font-size: 24px;
        font-weight: 800;
      }
      h1 {
        margin-top: 18px;
        font-size: 70px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      h1 span {
        color: var(--orange);
      }
      .lead {
        margin-top: 12px;
        font-size: 24px;
        white-space: nowrap;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 80%, transparent);
      }
      .qa {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 22px;
      }
      .q {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 430px;
        padding: 6px 8px 6px 20px;
        border-radius: 9999px;
        background: var(--cream);
        font-size: 22px;
        font-weight: 800;
      }
      .a {
        padding: 2px 16px;
        border: 3px solid var(--ink);
        border-radius: 9999px;
        background: #fff;
        font-weight: 900;
      }
      .a b {
        color: var(--orange);
      }
      .footer {
        margin-top: 20px;
        font-size: 18px;
        font-weight: 800;
        color: color-mix(in srgb, var(--ink) 55%, transparent);
      }
      .avatars {
        position: relative;
        flex: none;
        width: 370px;
        height: 400px;
      }
      .avatar {
        position: absolute;
        overflow: hidden;
        border: 6px solid var(--ink);
        border-radius: 36px;
        background: #fff;
        box-shadow: 8px 8px 0 0 var(--orange);
      }
      .avatar svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .avatar.back-left {
        top: 4px;
        left: 0;
        width: 170px;
        height: 170px;
        transform: rotate(-8deg);
      }
      .avatar.back-right {
        top: 22px;
        right: 8px;
        width: 170px;
        height: 170px;
        transform: rotate(7deg);
      }
      .avatar.front {
        bottom: 6px;
        left: 60px;
        width: 240px;
        height: 240px;
        transform: rotate(-2deg);
      }
      .sticker {
        position: absolute;
        right: 0;
        bottom: 190px;
        padding: 4px 18px;
        border: 5px solid var(--ink);
        border-radius: 20px;
        background: var(--orange);
        box-shadow: 0 5px 0 0 var(--ink);
        color: #fff;
        font-size: 32px;
        font-weight: 900;
        transform: rotate(8deg);
      }
    </style>
  </head>
